# Minimal environment for the paper figures in figs/ (environment.yml is the full lab environment).
name: bandit-figures
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=2.2
  - pandas=2.2      # tested with pandas 2.2
  - scipy=1.15
  - matplotlib=3.10
  - seaborn=0.13
  - ipykernel       # to run the # %% cells in VS Code
